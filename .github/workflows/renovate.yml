# Fleet Renovate: dependency-update PRs across every unified-systems-com repository carrying the
# `tap-plugin` topic, and tap itself, as the `tap-renovate` GitHub App.
#
# Which repositories: the `discover` job runs scripts/discover_fleet.py, which lists the org's
# repositories and keeps those carrying the topic (owner-checked, archived ones dropped,
# org-bots refused). It needs no secret: the org's repository list is public, and the job holds
# only its read-only GITHUB_TOKEN. Its answer reaches renovate/global.js as ORG_BOTS_FLEET; tap
# is named, not discovered (the `core` list), and is selected with the fleet like any other
# repository. The `renovate` job, which holds the bot's token, starts only
# after discovery has succeeded.
#
# Each run mints an installation token for the run's slice of the fleet ONLY, with contents:
# write, pull_requests: write and workflows: write (workflows so Renovate can bump the pinned
# `uses:` SHAs in .github/workflows). Renovate pushes its `renovate/*` branches to the target
# repository itself and opens the PR from there; the PR is authored by `tap-renovate[bot]`, account
# type `Bot`, and runs the target's own checks like any in-repository PR. Every update is a PR and
# is merged by a human.
#
# Credential: the App's private key, held ONLY as the `TAP_RENOVATE_PRIVATE_KEY` secret of this
# repository's `bots` environment (deploys from `main` only), with its Client ID as the
# variable `TAP_RENOVATE_CLIENT_ID`. The token lives for the run (an hour at most).
#
# Rotation: generate a new key on the App, replace the environment secret, delete the old key
# on the App. The next run picks it up.
name: renovate

on:
  # The daily run works through the fleet one slice at a time (scripts/next_batch.py), so a
  # backlog, or a long absence, is worked off by simply letting the schedule keep running.
  # Cron stays commented out until the pilot has run clean (see README, "The ramp"); until
  # then every run is a dispatch.
  # schedule:
  #   - cron: "15 7 * * *"   # daily 07:15 UTC, then a random 0-10 minute start
  workflow_dispatch:
    inputs:
      only:
        description: "Run on this ONE repository (name, no owner): tap or a discovered one. \"fleet\" for the slice of tap plus the discovered repositories."
        required: false
        default: "fleet"
        type: string
      batch:
        description: "Fleet slice for a fleet/all run: <i>/<n> (every n-th repository from the i-th), \"auto\" (the slice after the last successful auto run, wrapping after 8, so a gap changes nothing), or \"all\" (the whole fleet at once: do not, on a young account)."
        required: false
        default: "auto"
        type: string
      logLevel:
        description: "Renovate log level (debug for troubleshooting)"
        required: false
        default: "info"
        type: choice
        options: [info, debug]

permissions: {}

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  discover:
    name: discover (tap-plugin topic)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read   # check out this repository (the discovery script)
      actions: read    # read this workflow's past runs: the rotation's only state
    outputs:
      fleet: ${{ steps.discover.outputs.fleet }}
      batch: ${{ steps.batch.outputs.batch }}
      label: ${{ steps.batch.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Discover the fleet
        id: discover
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I scripts/discover_fleet.py --github-output fleet

      - name: Choose the fleet slice (the ramp)
        id: batch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BATCH_INPUT: ${{ inputs.batch || 'auto' }}
          ONLY_INPUT: ${{ inputs.only || 'fleet' }}
        run: python3 -I scripts/next_batch.py --batch "$BATCH_INPUT" --only "$ONLY_INPUT" --github-output

  renovate:
    # The label is the rotation's memory: scripts/next_batch.py reads it back from the run
    # history, so keep the form `renovate (auto <i>/<n>)`.
    name: renovate (${{ needs.discover.outputs.label }})
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: bots
    permissions:
      contents: read   # check out this repository (the global config)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Start at a random moment (the ramp)
        # A scheduled run fires at the same minute every time; a random 0-10 minute start
        # keeps the bot's activity from landing on a fixed rhythm.
        run: sleep $(( RANDOM % 601 ))

      - name: Choose this run's repositories
        id: slice
        env:
          FLEET_JSON: ${{ needs.discover.outputs.fleet }}
          BATCH: ${{ needs.discover.outputs.batch }}
          ONLY: ${{ inputs.only || 'fleet' }}
        run: |
          set -euo pipefail
          # The same cut renovate/global.js makes (every n-th name of the sorted list from the
          # i-th), repeated here because the token must be scoped before Renovate starts.
          if [[ "$BATCH" == "all" ]]; then
            slice_i=1; slice_n=1
          elif [[ "$BATCH" =~ ^([1-9][0-9]*)/([1-9][0-9]*)$ ]] \
               && (( BASH_REMATCH[1] <= BASH_REMATCH[2] )); then
            slice_i=${BASH_REMATCH[1]}; slice_n=${BASH_REMATCH[2]}
          else
            echo "::error::the fleet slice is unset or malformed"
            exit 1
          fi
          mapfile -t repos < <(jq -r --argjson i "$slice_i" --argjson n "$slice_n" \
            '(.fleet + (.core // [])) | unique | to_entries[] | select(.key % $n == $i - 1) | .value' <<< "$FLEET_JSON")
          if [[ "$ONLY" != "fleet" ]]; then
            if ! jq -e --arg n "$ONLY" '(.fleet + (.core // [])) | index($n) != null' <<< "$FLEET_JSON" > /dev/null; then
              echo "::error::'${ONLY}' is not tap or a discovered repository (\"all\" and unknown names are refused)"
              exit 1
            fi
            repos=("$ONLY")
          fi
          if (( ${#repos[@]} == 0 )); then
            echo "::error::discovery produced no repositories for slice ${BATCH}"
            exit 1
          fi
          for name in "${repos[@]}"; do
            # An empty or malformed list must never reach the token mint, which would scope the
            # token to every repository in the installation.
            if [[ ! "$name" =~ ^[A-Za-z0-9._-]+$ || "$name" == "." || "$name" == ".." || "$name" == "org-bots" ]]; then
              echo "::error::discovery produced an unusable repository name"
              exit 1
            fi
          done
          echo "repos=$(IFS=,; echo "${repos[*]}")" >> "$GITHUB_OUTPUT"

      - name: Mint the tap-renovate token for these repositories only
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TAP_RENOVATE_CLIENT_ID }}
          private-key: ${{ secrets.TAP_RENOVATE_PRIVATE_KEY }}
          owner: unified-systems-com
          repositories: ${{ steps.slice.outputs.repos }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Run Renovate
        uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        with:
          token: ${{ steps.app.outputs.token }}
          configurationFile: renovate/global.js
          # The action mounts the configuration file alone, at /github-action/global.js.
          # global.js requires ./preset.js, so mount that beside it, read-only. The boot-record
          # digest refresh that preset.js runs after a plugin-pin bump (the one command
          # global.js allows) is mounted the same way. Mounts are separated by `;`.
          docker-volumes: ${{ github.workspace }}/renovate/preset.js:/github-action/preset.js:ro;${{ github.workspace }}/renovate/boot-records:/github-action/boot-records:ro
          # The container receives the token, so pin its image by digest: a retag of `44`
          # cannot swap the code that holds it. Resolved from ghcr.io/renovatebot/renovate:44
          # on 2026-09-26 (Renovate 44.115.10).
          renovate-version: 44@sha256:e262ed52b23dd8c545c80faf5b1ad5c95a07b3f198888de8d7b8928f45c307c7
          # global.js reads ORG_BOTS_FLEET (the discovered repositories), ORG_BOTS_ONLY (the
          # pilot's one-repository narrowing) and the bot identity, so pass those into the
          # container too. The rest is the action's default
          # allow-list.
          env-regex: "^(?:RENOVATE_\\w+|LOG_LEVEL|GITHUB_COM_TOKEN|NODE_OPTIONS|NO_COLOR|ORG_BOTS_FLEET|ORG_BOTS_ONLY|ORG_BOTS_BATCH|RENOVATE_BOT_LOGIN|RENOVATE_BOT_ID)$"
        env:
          # The App's bot user, for commit authorship (public). If the App is ever recreated
          # this changes: gh api 'users/tap-renovate[bot]' --jq .id
          RENOVATE_BOT_LOGIN: "tap-renovate[bot]"
          RENOVATE_BOT_ID: "353051615"
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          ORG_BOTS_FLEET: ${{ needs.discover.outputs.fleet }}
          ORG_BOTS_ONLY: ${{ inputs.only || 'fleet' }}
          ORG_BOTS_BATCH: ${{ needs.discover.outputs.batch }}
