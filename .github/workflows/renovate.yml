# Fleet Renovate: dependency-update PRs across the repositories listed in renovate/global.js,
# as the org-owned `tap-renovate` GitHub App.
#
# Credential: the App's private key, held ONLY as the `TAP_RENOVATE_PRIVATE_KEY` secret of
# this repository's `bots` environment. That environment deploys from `main` only, so the
# key is handed to nothing but a workflow already merged to main here. The job mints a
# ~1h installation token scoped to exactly the listed repositories (plus this one, for the
# shared preset) and to the App's own permission set. The client ID below is public.
#
# Rotation: generate a new key in the App's settings, replace the environment secret, delete
# the old key there. No restart semantics: the next run picks it up.
#
# PR-only: automerge is off, so every update is a PR that runs the target repository's own
# checks and is merged by a human.
name: renovate

on:
  # Pilot: hand-run only, one repository at a time. The daily schedule
  #   schedule:
  #     - cron: "15 7 * * *"   # daily 07:15 UTC
  # comes back, fleet-wide, in the PR that ends the pilot.
  workflow_dispatch:
    inputs:
      only:
        description: "Run on this ONE listed repository (name, no owner), or \"all\" for every listed repository."
        required: false
        default: "tap-plugin-github-core"
        type: string
      logLevel:
        description: "Renovate log level (debug for troubleshooting)"
        required: false
        default: "info"
        type: choice
        options: [info, debug]

permissions: {}

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: renovate (fleet)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: bots
    permissions:
      contents: read   # check out this private repository (the global config)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read the repository list from the global config
        id: scope
        env:
          SELF: ${{ github.event.repository.name }}
          ORG_BOTS_ONLY: ${{ inputs.only }}
        run: node renovate/token-scope.js "$SELF" >> "$GITHUB_OUTPUT"

      - name: Mint the tap-renovate token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: Iv23liLCwMcCyJuDEusb   # tap-renovate (gh api apps/tap-renovate)
          private-key: ${{ secrets.TAP_RENOVATE_PRIVATE_KEY }}
          owner: unified-systems-com
          repositories: ${{ steps.scope.outputs.repositories }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
          permission-issues: write
          permission-checks: read
          permission-statuses: read
          permission-vulnerability-alerts: read

      - name: Run Renovate
        uses: renovatebot/github-action@9fea9f0fbf80401026d11d03911d62b1f70fef1f # v46.3.3
        with:
          token: ${{ steps.app.outputs.token }}
          configurationFile: renovate/global.js
          # The container receives the token, so pin its image by digest: a retag of `44`
          # cannot swap the code that holds it. Resolved from ghcr.io/renovatebot/renovate:44
          # on 2026-09-26 (Renovate 44.115.10).
          renovate-version: 44@sha256:e262ed52b23dd8c545c80faf5b1ad5c95a07b3f198888de8d7b8928f45c307c7
          # Pass ORG_BOTS_ONLY into the container too, so global.js narrows the same way the
          # token did. The rest is the action's default allow-list.
          env-regex: "^(?:RENOVATE_\\w+|LOG_LEVEL|GITHUB_COM_TOKEN|NODE_OPTIONS|NO_COLOR|ORG_BOTS_ONLY)$"
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          ORG_BOTS_ONLY: ${{ inputs.only }}
