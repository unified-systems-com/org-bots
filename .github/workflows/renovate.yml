# Fleet Renovate: dependency-update PRs across the repositories listed in renovate/global.js,
# in FORK MODE, as the fork bot: a machine user with no role on any org repository.
#
# Renovate forks each listed repository into the bot's account, pushes its update branches
# to that fork, and opens the PR from the fork, exactly as an outside contributor would.
# Nothing here can write to an org repository: the bot's writes reach only its own forks.
# Every update is a PR that runs the target's own checks and is merged by a human.
#
# Credential: the bot's token, held ONLY as the `FORK_BOT_TOKEN` secret of this repository's
# `bots` environment (deploys from `main` only). It is passed as both the platform token and
# RENOVATE_FORK_TOKEN, which is what fork mode expects. The bot's login and numeric id are
# the environment VARIABLES `FORK_BOT_LOGIN` and `FORK_BOT_ID` (see renovate/global.js).
#
# Rotation: mint a new token on the bot account, replace the environment secret, revoke the
# old token there. The next run picks it up.
name: renovate

on:
  # Pilot: hand-run only, one repository at a time. The daily schedule
  #   schedule:
  #     - cron: "15 7 * * *"   # daily 07:15 UTC
  # comes back, fleet-wide, in the PR that ends the pilot.
  workflow_dispatch:
    inputs:
      only:
        description: "Run on this ONE listed repository (name, no owner), or \"all\" for every listed repository."
        required: false
        default: "tap-plugin-github-core"
        type: string
      logLevel:
        description: "Renovate log level (debug for troubleshooting)"
        required: false
        default: "info"
        type: choice
        options: [info, debug]

permissions: {}

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: renovate (fleet)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: bots
    permissions:
      contents: read   # check out this private repository (the global config)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run Renovate
        uses: renovatebot/github-action@9fea9f0fbf80401026d11d03911d62b1f70fef1f # v46.3.3
        with:
          token: ${{ secrets.FORK_BOT_TOKEN }}
          configurationFile: renovate/global.js
          # The action mounts the configuration file alone, at /github-action/global.js.
          # global.js requires ./preset.js, so mount that beside it, read-only. The boot-record
          # digest refresh that preset.js runs after a plugin-pin bump (the one command
          # global.js allows) is mounted the same way. Mounts are separated by `;`.
          docker-volumes: ${{ github.workspace }}/renovate/preset.js:/github-action/preset.js:ro;${{ github.workspace }}/renovate/boot-records:/github-action/boot-records:ro
          # The container receives the token, so pin its image by digest: a retag of `44`
          # cannot swap the code that holds it. Resolved from ghcr.io/renovatebot/renovate:44
          # on 2026-09-26 (Renovate 44.115.10).
          renovate-version: 44@sha256:e262ed52b23dd8c545c80faf5b1ad5c95a07b3f198888de8d7b8928f45c307c7
          # global.js reads ORG_BOTS_ONLY (the pilot's one-repository narrowing) and the bot
          # identity, so pass those into the container too. The rest is the action's default
          # allow-list.
          env-regex: "^(?:RENOVATE_\\w+|LOG_LEVEL|GITHUB_COM_TOKEN|NODE_OPTIONS|NO_COLOR|ORG_BOTS_ONLY|FORK_BOT_LOGIN|FORK_BOT_ID)$"
        env:
          RENOVATE_FORK_TOKEN: ${{ secrets.FORK_BOT_TOKEN }}
          FORK_BOT_LOGIN: ${{ vars.FORK_BOT_LOGIN }}
          FORK_BOT_ID: ${{ vars.FORK_BOT_ID }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          ORG_BOTS_ONLY: ${{ inputs.only }}
