# Fleet release-please: release PRs and releases for every unified-systems-com repository
# carrying the `tap-plugin` topic, as the org-owned `tap-release-please` GitHub App.
#
# Which repositories: the same discovery Renovate uses (scripts/discover_fleet.py, the
# `discover` job), plus tap, which is named rather than discovered. It needs no secret: the org's
# repository list is public. tap's PR-check identity list (tap/tap.pr-bots.json) names this App's
# bot, so the App's PRs pass tap's DCO and issue-link checks (README, "tap"). scripts/run-as-
# maintainer.sh remains the hand fallback.
#
# Per repository in this run's slice, in this order (what release-please-action does):
#   1. `github-release`: if a release PR has been merged since the last run, tag the merge
#      commit vX.Y.Z and publish the GitHub Release. The tag is made with the App token, so the
#      target's tag-push workflows (release-sbom.yml, publish-release-tags) run on it; a
#      GITHUB_TOKEN-made tag would trigger nothing.
#   2. `release-pr`: open or refresh the one rolling release PR from the conventional commits
#      since the last release. The branch is in the repository itself, labelled by release-please
#      (`autorelease: pending`), so the repository's own checks run on it as on any PR.
#   3. The boot-record digest refresh (below), pushed to the release branch.
# Nothing is released until a human merges that repository's release PR.
#
# Credential: the App's private key, held ONLY as the `TAP_RELEASE_PLEASE_PRIVATE_KEY` secret of
# this repository's `bots` environment (deploys from `main` only). Each run mints an installation
# token for ONLY this run's repositories (a few, not the fleet) with contents + pull-requests
# write, and no `workflows` permission, so it cannot edit a workflow file. The token lasts an
# hour and is revoked when the job ends. The client ID is the environment VARIABLE
# `TAP_RELEASE_PLEASE_CLIENT_ID`; it is public.
#
# The App is installed on selected repositories, not all of them: a new repository is added to
# the installation by the new-plugin procedure (README, "Adding a repository"). A repository
# missing from the installation fails the token mint for the whole slice, loudly, rather than
# being skipped.
#
# Adding a repository: the `tap-plugin` topic puts it in scope (new-plugin applies it). It is
# released once it has release-please-config.json and .release-please-manifest.json at its
# root; until then this job skips it with a notice (see "not configured" below).
name: release-please

on:
  # Pilot: hand-run only. The hourly schedule
  #   schedule:
  #     - cron: "23 * * * *"   # hourly
  # comes back in the PR that ends the pilot.
  workflow_dispatch:
    inputs:
      only:
        description: "Run on this ONE repository (name, no owner): tap or a discovered one. \"fleet\" (the default) runs this run's rotation slice."
        required: false
        default: "fleet"
        type: string
      batch:
        description: "Fleet slice for a fleet run: <i>/<n> (every n-th discovered repository from the i-th), \"auto\" (the slice after the last successful auto run, wrapping after 8, so a gap changes nothing), or \"all\" (the whole fleet; MAX_NEW_PRS still caps new release PRs)."
        required: false
        default: "auto"
        type: string

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  discover:
    name: discover (tap-plugin topic)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read   # check out this repository (the discovery script)
      actions: read    # read this workflow's past runs: the rotation's only state
    outputs:
      fleet: ${{ steps.discover.outputs.fleet }}
      batch: ${{ steps.batch.outputs.batch }}
      label: ${{ steps.batch.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Discover the fleet
        id: discover
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I scripts/discover_fleet.py --github-output fleet

      - name: Choose the fleet slice (the ramp)
        id: batch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BATCH_INPUT: ${{ inputs.batch || 'auto' }}
          ONLY_INPUT: ${{ inputs.only || 'fleet' }}
        run: python3 -I scripts/next_batch.py --workflow release-please.yml --job release-please --batch "$BATCH_INPUT" --only "$ONLY_INPUT" --github-output

  release-please:
    # The label is the rotation's memory: scripts/next_batch.py reads it back from the run
    # history, so keep the form `release-please (auto <i>/<n>)`. Distinct from Renovate's
    # `renovate (auto <i>/<n>)`, so the two rotations never interfere.
    name: release-please (${{ needs.discover.outputs.label }})
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: bots
    permissions:
      contents: read   # check out this repository (the pinned CLI)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install the pinned release-please CLI
        working-directory: release-please
        # package-lock.json pins release-please and its whole closure by integrity hash.
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Choose this run's repositories
        id: slice
        env:
          # tap is in the slices: the discovered repositories plus tap (`.fleet` and `.core`).
          FLEET_JSON: ${{ needs.discover.outputs.fleet }}
          # This run's slice of the fleet, <i>/<n> or "all" (scripts/next_batch.py).
          BATCH: ${{ needs.discover.outputs.batch }}
          ONLY: ${{ inputs.only || 'fleet' }}
        run: |
          set -euo pipefail
          # The slice is cut from the SORTED list, so it is the same set on every run (every
          # n-th name from the i-th, as renovate/global.js cuts ORG_BOTS_BATCH). "all" is no cut.
          if [[ "$BATCH" == "all" ]]; then
            slice_i=1; slice_n=1
          elif [[ "$BATCH" =~ ^([1-9][0-9]*)/([1-9][0-9]*)$ ]] \
               && (( BASH_REMATCH[1] <= BASH_REMATCH[2] )); then
            slice_i=${BASH_REMATCH[1]}; slice_n=${BASH_REMATCH[2]}
          else
            echo "::error::the fleet slice is unset or malformed"
            exit 1
          fi
          # Shuffled after the cut, so the per-run cap cannot keep serving the same first
          # repositories and starve the rest: over several runs every repository comes up.
          mapfile -t repos < <(jq -r --argjson i "$slice_i" --argjson n "$slice_n" \
            '(.fleet + (.core // [])) | unique | to_entries[] | select(.key % $n == $i - 1) | .value' \
            <<< "$FLEET_JSON" | shuf)
          if [[ "$ONLY" != "fleet" ]]; then
            # One repository: it must be a discovered one, not an arbitrary name.
            if ! jq -e --arg n "$ONLY" '(.fleet + (.core // [])) | index($n) != null' <<< "$FLEET_JSON" > /dev/null; then
              echo "::error::'${ONLY}' is not tap or a discovered repository (unknown names are refused)"
              exit 1
            fi
            repos=("$ONLY")
          fi
          if (( ${#repos[@]} == 0 )); then
            echo "::error::discovery produced no repositories for slice ${BATCH}"
            exit 1
          fi
          for name in "${repos[@]}"; do
            # discover_fleet.py only emits plain names; checked again here before any use. An
            # empty or malformed list must never reach the token mint, which would scope the
            # token to every repository in the installation.
            if [[ ! "$name" =~ ^[A-Za-z0-9._-]+$ || "$name" == "." || "$name" == ".." || "$name" == "org-bots" ]]; then
              echo "::error::discovery produced an unusable repository name"
              exit 1
            fi
          done
          echo "repos=$(IFS=,; echo "${repos[*]}")" >> "$GITHUB_OUTPUT"

      - name: Mint the tap-release-please token for these repositories only
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TAP_RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.TAP_RELEASE_PLEASE_PRIVATE_KEY }}
          owner: unified-systems-com
          repositories: ${{ steps.slice.outputs.repos }}
          permission-contents: write
          permission-pull-requests: write

      - name: Release, then refresh the release PR, per repository
        working-directory: release-please
        env:
          RP_TOKEN: ${{ steps.app.outputs.token }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPOS: ${{ steps.slice.outputs.repos }}
          # The App's bot user, for the digest-refresh commit's identity. Public. If the App is
          # ever recreated this changes: gh api 'users/tap-release-please[bot]' --jq .id
          BOT_ID: "352957841"
          # The ramp: at most MAX_NEW_PRS new release PRs per run, and a RANDOM pause of
          # PAUSE_MIN..PAUSE_MAX seconds after each, so no two runs have the same rhythm.
          # The first fleet run opened 22 at once and GitHub flagged the old bot account
          # (2026-09-28). Refreshing an existing release PR is not capped; repositories past
          # the cap are deferred to the next run with a notice, not failed.
          MAX_NEW_PRS: "3"
          PAUSE_MIN: "120"
          PAUSE_MAX: "300"
        run: |
          set -euo pipefail
          refresh="${GITHUB_WORKSPACE}/renovate/boot-records/refresh.py"
          # git reads the token from the environment through this helper, so it is never on a
          # command line or in a remote URL.
          # shellcheck disable=SC2016  # expanded by the helper's shell when git runs it, not here
          askpass_helper='!f() { echo username=x-access-token; echo "password=${RP_TOKEN}"; }; f'
          failed=()
          new_prs=0
          IFS=',' read -r -a repos <<< "$REPOS"
          for name in "${repos[@]}"; do
            if [[ ! "$name" =~ ^[A-Za-z0-9._-]+$ || "$name" == "." || "$name" == ".." ]]; then
              echo "::error::an unusable repository name reached the release loop"
              exit 1
            fi
            repo="unified-systems-com/${name}"
            echo "::group::${repo}"

            # Not configured: a discovered repository without release-please's two files at its
            # root has nothing to release yet. Skipped with a notice, not a failure, so the
            # topic can be applied before a repository adopts release-please.
            if ! root=$(gh api "repos/${repo}/contents/" --jq '.[].name'); then
              echo "::endgroup::"
              echo "::error::could not list ${repo}'s root"
              failed+=("$repo"); continue
            fi
            if ! grep -qxF 'release-please-config.json' <<< "$root" \
               || ! grep -qxF '.release-please-manifest.json' <<< "$root"; then
              echo "::endgroup::"
              echo "::notice::${repo} has no release-please-config.json and .release-please-manifest.json; skipped"
              continue
            fi

            # Own lane: a repository that still runs its own release-please workflow has an
            # in-repo release PR already; a second one from here would compete with it.
            if ! workflows=$(gh api "repos/${repo}/contents/.github/workflows" --jq '.[].name'); then
              echo "::endgroup::"
              echo "::error::could not list ${repo}'s workflows"
              failed+=("$repo"); continue
            fi
            if grep -qxE 'release-please\.ya?ml' <<< "$workflows"; then
              echo "::endgroup::"
              echo "::warning::${repo} still runs its own release-please workflow; skipped until that is retired"
              continue
            fi

            # 1. Tag and publish a release whose PR a human has merged. Not capped: it opens no PR.
            if ! npx --no-install release-please github-release \
                 --token="$RP_TOKEN" --repo-url="$repo" \
                 --config-file=release-please-config.json \
                 --manifest-file=.release-please-manifest.json; then
              echo "::endgroup::"
              echo "::error::release-please github-release failed for ${repo}"
              failed+=("$repo"); continue
            fi

            # 2. Open or refresh the rolling release PR. A new one is capped and paced. Only a PR
            # whose branch is in this repository counts: a fork PR can be named anything, so a
            # `release-please--*` fork PR must neither count as "already has one" (which would skip
            # the cap) nor be picked for the digest refresh.
            if ! had_pr=$(gh pr list -R "$repo" --state open --limit 100 \
                            --json headRefName,isCrossRepository \
                            --jq '[.[] | select(.isCrossRepository | not) | select(.headRefName | startswith("release-please--"))] | length'); then
              echo "::endgroup::"
              echo "::error::could not list ${repo}'s open pull requests"
              failed+=("$repo"); continue
            fi
            if [[ "$had_pr" == "0" ]] && (( new_prs >= MAX_NEW_PRS )); then
              echo "::endgroup::"
              echo "::notice::${repo}: deferred to the next run (this run already opened ${new_prs} new release PRs)"
              continue
            fi
            if ! npx --no-install release-please release-pr \
                 --token="$RP_TOKEN" --repo-url="$repo" \
                 --config-file=release-please-config.json \
                 --manifest-file=.release-please-manifest.json; then
              echo "::endgroup::"
              echo "::error::release-please release-pr failed for ${repo}"
              failed+=("$repo"); continue
            fi

            # 3. Digest refresh. release-please moves the plugin's own `rev` in its in-package CI
            # boot record (an extra-files entry in the repository's config), and that moves the
            # record's sha256 declared in tap-plugin.toml, which release-please cannot compute.
            # So the release branch gets the same refresh Renovate runs after a pin bump
            # (renovate/boot-records/refresh.py, tap's own derivation vendored at a pinned
            # commit), pushed to the branch as one more commit. Without a CI record, or with
            # digests already right, nothing is pushed. release-please rewrites the branch only
            # when the release notes change, and this step runs again right after it does.
            if ! branch=$(gh pr list -R "$repo" --state open --limit 100 \
                            --json headRefName,isCrossRepository \
                            --jq '[.[] | select(.isCrossRepository | not) | select(.headRefName | startswith("release-please--")) | .headRefName] | first // empty'); then
              echo "::endgroup::"
              echo "::error::could not list ${repo}'s open pull requests after release-please"
              failed+=("$repo"); continue
            fi
            if [[ -z "$branch" ]]; then
              echo "::endgroup::"
              continue   # no release pending
            fi
            if [[ "$had_pr" == "0" ]]; then
              # A new release PR exists from here on, whatever happens to its digest refresh
              # below, so count it and pause now: every later exit from this iteration is
              # then already paced.
              new_prs=$((new_prs + 1))
              sleep $(( PAUSE_MIN + RANDOM % (PAUSE_MAX - PAUSE_MIN + 1) ))
            fi
            if [[ ! "$branch" =~ ^release-please--[A-Za-z0-9._/-]+$ || "$branch" == *..* ]]; then
              echo "::endgroup::"
              echo "::error::${repo}'s release branch name is unusable"
              failed+=("$repo"); continue
            fi
            work=$(mktemp -d)
            if ! git -c credential.helper= -c "credential.helper=${askpass_helper}" \
                   clone --quiet --depth 1 --branch "$branch" \
                   "https://github.com/${repo}.git" "${work}/${name}"; then
              echo "::endgroup::"
              echo "::error::could not clone the release branch of ${repo}"
              failed+=("$repo"); continue
            fi
            if ! python3 -I "$refresh" --repo "${work}/${name}"; then
              echo "::endgroup::"
              echo "::error::the boot-record digest refresh failed for ${repo}"
              failed+=("$repo"); continue
            fi
            if ! changed=$(git -C "${work}/${name}" status --porcelain --untracked-files=all); then
              echo "::endgroup::"
              echo "::error::could not read the refresh's changes for ${repo}"
              failed+=("$repo"); continue
            fi
            if [[ -z "$changed" ]]; then
              echo "boot-record digests already current"
              echo "::endgroup::"
              continue
            fi
            # Only the digest files may be committed: a modified `tap_plugin/<slug>/tap-plugin.toml`,
            # as Renovate's fileFilters allows. Anything else the refresh touched stops the push.
            if grep -vqE '^ M tap_plugin/[A-Za-z0-9_]+/tap-plugin\.toml$' <<< "$changed"; then
              echo "::endgroup::"
              echo "::error::the digest refresh for ${repo} changed files other than tap-plugin.toml; nothing pushed"
              failed+=("$repo"); continue
            fi
            # The App's own identity. No Signed-off-by: a bot does not certify the DCO; the
            # human who merges does.
            if ! { git -C "${work}/${name}" add -- 'tap_plugin/*/tap-plugin.toml' \
                   && git -C "${work}/${name}" -c user.name="tap-release-please[bot]" \
                     -c user.email="${BOT_ID}+tap-release-please[bot]@users.noreply.github.com" \
                     commit --quiet -m "chore: refresh boot-record digests for the release" \
                   && git -C "${work}/${name}" -c credential.helper= -c "credential.helper=${askpass_helper}" \
                     push --quiet origin "HEAD:refs/heads/${branch}"; }; then
              echo "::endgroup::"
              echo "::error::could not push the digest refresh to ${repo}:${branch}"
              failed+=("$repo"); continue
            fi
            echo "pushed the boot-record digest refresh to ${repo}:${branch}"
            echo "::endgroup::"
          done
          # One repository failing does not stop the others; the run still goes red.
          if (( ${#failed[@]} )); then
            echo "failed: ${failed[*]}"
            exit 1
          fi
